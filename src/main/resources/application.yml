spring:
  application:
    name: Notification Service
  profiles:
    active: dev

  data:
    mongodb:
      auto-index-creation: true
  mongodb:
    host: localhost
    port: 27017
    database: notification_service

  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        max-concurrency: 10
        prefetch: 1
        concurrency: 3
        default-requeue-rejected: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  thymeleaf:
    check-template-location: false

mdc:
  traceId: "traceId"
  traceHeader: "X-Trace-Id"

server:
  port: 6300

logging:
  pattern:
    console: "{\"timestamp\":\"%d{yyyy-MM-dd HH:mm:ss.SSS}\",\"level\":\"%level\",\"thread\":\"%thread\",\"logger\":\"%logger\",\"message\":\"%msg\",\"traceId\":\"%X{traceId}\"}%n"